name: Sync EFT CRM mail and notifications

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eft-crm-notifications
  cancel-in-progress: false

jobs:
  sync-and-remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          BEGET_SSH_KNOWN_HOSTS: ${{ secrets.CRM_BEGET_SSH_KNOWN_HOSTS }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.CRM_BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$BEGET_SSH_PRIVATE_KEY" > ~/.ssh/beget_deploy
          chmod 600 ~/.ssh/beget_deploy
      - name: Sync mail and send reminders
        env:
          BEGET_SSH_HOST: ${{ secrets.CRM_BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ secrets.CRM_BEGET_SSH_USER }}
          BEGET_DEPLOY_PATH: ${{ secrets.CRM_BEGET_DEPLOY_PATH }}
        run: |
          for name in BEGET_SSH_HOST BEGET_SSH_USER BEGET_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then echo "::error::Notification scheduler: missing setting ${name}"; exit 1; fi
          done
          if ! [[ "$BEGET_DEPLOY_PATH" = "." || "$BEGET_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]]; then
            echo '::error::Notification scheduler: deployment directory must be an absolute path or a dot'
            exit 1
          fi
          report_failure() {
            reason='remote command failed'
            error_file="$RUNNER_TEMP/eft-notifications.stderr"
            if grep -qi 'Permission denied' "$error_file"; then reason='SSH authentication rejected';
            elif grep -qi 'Host key verification failed' "$error_file"; then reason='SSH server key verification failed';
            elif grep -qi 'Connection refused' "$error_file"; then reason='SSH connection refused';
            elif grep -qi 'timed out' "$error_file"; then reason='SSH connection timed out';
            elif grep -qi 'Could not resolve hostname' "$error_file"; then reason='SSH host could not be resolved';
            elif grep -qi 'No such file or directory' "$error_file"; then reason='server directory or PHP binary missing'; fi
            echo "::error::Notification scheduler: $reason"
          }
          trap report_failure ERR
          ssh -p 22 -i ~/.ssh/beget_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${BEGET_SSH_USER}@${BEGET_SSH_HOST}" \
            "bash -s -- '${BEGET_DEPLOY_PATH%/}/api'" 2> "$RUNNER_TEMP/eft-notifications.stderr" <<'REMOTE'
          set -e
          cd "$1"
          for binary in "$(command -v php8.4 || true)" "$(command -v php8.3 || true)" "$(command -v php8.2 || true)" /usr/bin/php8.4 /usr/bin/php8.3 /usr/bin/php8.2 /usr/local/bin/php8.4 /usr/local/bin/php8.3 /usr/local/bin/php8.2 /usr/local/bin/php8.1 /usr/local/php-cgi/8.4/bin/php /usr/local/php-cgi/8.3/bin/php /usr/local/php-cgi/8.2/bin/php /usr/local/php-cgi/8.1/bin/php; do
            if test -x "$binary"; then
              "$binary" -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);' || continue
              "$binary" -d display_errors=1 notifications_cron.php
              exit 0
            fi
          done
          echo '::error::PHP 8.1+ CLI interpreter for scheduled notifications is unavailable' >&2
          exit 1
          REMOTE
