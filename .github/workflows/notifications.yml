name: Sync EFT CRM mail and notifications

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eft-crm-notifications
  cancel-in-progress: false

jobs:
  sync-and-remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          BEGET_SSH_KNOWN_HOSTS: ${{ secrets.CRM_BEGET_SSH_KNOWN_HOSTS }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.CRM_BEGET_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$BEGET_SSH_PRIVATE_KEY" > ~/.ssh/beget_deploy
          chmod 600 ~/.ssh/beget_deploy
      - name: Sync mail and send reminders
        env:
          BEGET_SSH_HOST: ${{ secrets.CRM_BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ secrets.CRM_BEGET_SSH_USER }}
          BEGET_DEPLOY_PATH: ${{ secrets.CRM_BEGET_DEPLOY_PATH }}
        run: |
          : "${BEGET_SSH_HOST:?Missing CRM_BEGET_SSH_HOST}"
          : "${BEGET_SSH_USER:?Missing CRM_BEGET_SSH_USER}"
          : "${BEGET_DEPLOY_PATH:?Missing CRM_BEGET_DEPLOY_PATH}"
          [[ "$BEGET_DEPLOY_PATH" = "." || "$BEGET_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]]
          ssh -p 22 -i ~/.ssh/beget_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${BEGET_SSH_USER}@${BEGET_SSH_HOST}" \
            "cd '${BEGET_DEPLOY_PATH%/}/api' && php -v && php -d display_errors=1 notifications_cron.php"
